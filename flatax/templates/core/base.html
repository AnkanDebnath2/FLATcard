<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <title>{% block title %}{% endblock %} | Flatcard</title>
</head>
<body>
    <nav class="py-6 px-6 flex justify-between items-center border-b border-gray-300">
        <a href="/" class="text-lg font-semibold">Flatcard</a>
        <div class="space-x-6">
            <a href="/" class="text-gray-600 hover:text-gray-900">New Item</a>
            <a href="/contact/" class="text-gray-600 hover:text-gray-900">Contact</a>

  
            <a href="#" class="px-6 py-3 text-lg front-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700">Login</a>
            <a href="#" class="px-6 py-3 text-lg front-semibold text-white bg-gray-600 rounded-lg hover:bg-gray-700">Sign Up</a>

        </div>
        </nav>

    <div class="px-6 py-6">
        {% block content %}
        {% endblock %}
    </div>
    
<footer class="py-6 px-6 flex justify-between bg-gray-800">
        <div class="w-2/3 pr-10">
            <h3 class="text-lg font-semibold text-white mb-4">About Flatcard</h3>
            <p class="text-gray-400">Flatcard is a platform for buying and selling flats. We provide a simple and easy way to list your flat and connect with potential buyers.</p>
        </div>

        <div class="w-1/3">
            <h3 class="text-lg font-semibold text-white mb-4">Menu</h3>

            <ul class="space-y-2">
                <li><a href="#" class="text-lg text-teal-500 hover:text-white">About</a></li>
                <li><a href="{% url 'contact' %}" class="text-lg text-teal-500 hover:text-white">Contact</a></li>
                <li><a href="#" class="text-lg text-teal-500 hover:text-white">Privacy Policy</a></li>
                <li><a href="#" class="text-lg text-teal-500 hover:text-white">Team of use</a></li>
                
           

    </footer>
</body>
</html>
